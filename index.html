<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>门下 · 已迁址</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html { color-scheme: light dark; }
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         font:16px/1.7 -apple-system,"PingFang SC",system-ui,sans-serif;
         background:#faf7f2; color:#2b2b2b; }
  @media (prefers-color-scheme: dark) { body { background:#1a1a1a; color:#e6e2da; } }
  .box { text-align:center; padding:2rem; max-width:34rem; }
  .seal { display:inline-grid; place-items:center; width:2.4rem; height:2.4rem;
          background:#a8332a; color:#fff; border-radius:4px; font-size:1.3rem;
          font-family:"Songti SC",serif; }
  h1 { font-family:"Songti SC",serif; font-weight:600; font-size:1.5rem; margin:.8rem 0 .4rem; }
  p { opacity:.75; margin:.4rem 0; }
  a { color:#a8332a; }
  code { background:rgba(128,128,128,.15); padding:.1em .35em; border-radius:3px; }
</style>
</head>
<body>
<div class="box">
  <span class="seal">可</span>
  <h1>门下已迁址</h1>
  <p id="msg">正在转往新地址…</p>
  <p><a id="link" href="https://charliezong18.github.io/menxia/">https://charliezong18.github.io/menxia/</a></p>
  <p style="font-size:.85em;opacity:.55">
    2026-07-31 由「御笔朱批」<code>/zhupi/</code> 改名为「门下」<code>/menxia/</code>。
    这个页面只做转发，好让历史深链、书签、以及旧折 body 里的链接永久有效。
  </p>
</div>
<script>
  // 原样转发 query 与 hash —— 深链的全部信息都在这两处（?pr= / &path= / &line= / #L12）
  var target = 'https://charliezong18.github.io/menxia/' + location.search + location.hash;
  document.getElementById('link').href = target;
  document.getElementById('link').textContent = target;
  location.replace(target);
</script>
</body>
</html>
